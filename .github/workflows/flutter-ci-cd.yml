name: Mujeeb24 Flutter CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      production_release:
        description: 'PRODUCTION release: requires secured release keystore + verified certificate fingerprint'
        required: true
        type: boolean
        default: false
      build_android_apk:
        description: 'Build Android APK (Direct install)'
        required: false
        type: boolean
        default: true
      build_android_bundle:
        description: 'Build signed Android App Bundle (production only)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS Release (macOS runner, no codesign)'
        required: false
        type: boolean
        default: false
      api_base_url:
        description: 'Custom API Base URL override (optional --dart-define)'
        required: false
        type: string
        default: ''

# Least-privilege security permissions
permissions:
  contents: read

# Concurrency group to cancel duplicate PR runs while letting main branch pushes complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. Quality Gate Job: Formatting, Static Analysis, Automated Tests
  # =========================================================================
  quality-gate:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Log Environment Diagnostics
        run: |
          echo "=== Diagnostic Environment Information ==="
          echo "Operating System: $(uname -s) $(uname -r)"
          flutter --version
          dart --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: |
          echo "Checking Dart code formatting..."
          dart format --output=none --set-exit-if-changed lib/ test/ || {
            echo "::warning::Some files require formatting via 'dart format .'. Proceeding with quality checks."
          }

      - name: Static Analysis (flutter analyze)
        run: |
          echo "Running static analysis..."
          flutter analyze --no-fatal-infos

      - name: Execute Automated Test Suite (flutter test)
        run: |
          echo "Running all unit, integration, and widget tests..."
          flutter test --no-pub

  # =========================================================================
  # 2. Android Build Job: Release APK & App Bundle (AAB)
  # =========================================================================
  build-android:
    name: Build Android (production signing gate / QA preview)
    needs: quality-gate
    # Do not produce production release builds on Pull Requests
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_android_apk || inputs.build_android_bundle))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MUJEEB_PRODUCTION_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.production_release && 'true' || 'false' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Locked Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce production signing certificate (fail closed)
        id: android_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$MUJEEB_PRODUCTION_RELEASE" != 'true' ]]; then
            echo 'QA PREVIEW ONLY: using the isolated .preview app ID and Android debug signing.'
            echo 'signing_profile=preview' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Production build blocked: missing secret $required."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          actual="$(keytool -list -v -keystore android/app/release.keystore \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | grep -m 1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ || "$actual" != "$expected" ]]; then
            echo '::error::Production signing certificate fingerprint does not match the trusted value.'
            exit 1
          fi
          echo 'Release keystore and expected signing certificate verified.'
          echo 'signing_profile=production' >> "$GITHUB_OUTPUT"

      - name: Validate API endpoint without shell interpolation
        id: api_args
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          endpoint="${INPUT_API_BASE_URL:-${SECRET_API_BASE_URL:-}}"
          if [[ -n "$endpoint" ]]; then
            if [[ ! "$endpoint" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/api/v1)?/?$ ]]; then
              echo '::error::API base URL must be HTTPS with an optional /api/v1 path.'
              exit 1
            fi
            printf 'dart_define=--dart-define=API_BASE_URL=%s\n' "$endpoint" >> "$GITHUB_OUTPUT"
          else
            echo 'dart_define=' >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize release provenance and audit manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'run_number=%s\n' "$GITHUB_RUN_NUMBER"
            printf 'production_release=%s\n' "$MUJEEB_PRODUCTION_RELEASE"
            printf 'build_time_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > android-artifacts-manifest.txt

      - name: Build optimized APKs per Android architecture
        if: github.event_name == 'push' || inputs.build_android_apk
        shell: bash
        env:
          API_DEFINE: ${{ steps.api_args.outputs.dart_define }}
        run: |
          set -euo pipefail
          define=()
          if [[ -n "$API_DEFINE" ]]; then define+=("$API_DEFINE"); fi
          flutter build apk --release --split-per-abi \
            --build-number="${{ github.run_number }}" "${define[@]}"

      - name: Validate size, installable signatures, and APK manifest
        if: github.event_name == 'push' || inputs.build_android_apk
        shell: bash
        run: |
          set -euo pipefail
          root="build/app/outputs/flutter-apk"
          signer="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" -path '*/build-tools/*/apksigner' \
            -type f | sort -V | tail -n 1)"
          if [[ -z "$signer" ]]; then
            echo '::error::Android apksigner is unavailable; refusing unverified artifacts.'
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$root/app-$abi-release.apk"
            if [[ ! -s "$apk" ]]; then
              echo "::error::Missing or empty APK for $abi."
              exit 1
            fi
            "$signer" verify --print-certs "$apk" > /tmp/apk-signature.txt
            if [[ "$MUJEEB_PRODUCTION_RELEASE" == 'true' ]] &&
               grep -qi 'Android Debug' /tmp/apk-signature.txt; then
              echo '::error::Production APK was debug signed.'
              exit 1
            fi
            file_bytes="$(stat -c '%s' "$apk")"
            printf 'apk_%s_bytes=%s\n' "$abi" "$file_bytes" >> android-artifacts-manifest.txt
            sha256sum "$apk" >> android-artifacts-manifest.txt
            echo "$abi APK: $file_bytes bytes; signature verified."
          done

      - name: Build Google Play AAB (production signing only)
        if: inputs.production_release && inputs.build_android_bundle
        shell: bash
        env:
          API_DEFINE: ${{ steps.api_args.outputs.dart_define }}
        run: |
          set -euo pipefail
          define=()
          if [[ -n "$API_DEFINE" ]]; then define+=("$API_DEFINE"); fi
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" "${define[@]}"
          bundle=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" > /tmp/bundle-signature.txt
          if ! grep -q 'jar verified.' /tmp/bundle-signature.txt; then
            echo '::error::AAB signature verification failed.'
            exit 1
          fi
          sha256sum "$bundle" >> android-artifacts-manifest.txt

      - name: Upload primary ARM64 APK (one-architecture direct install)
        if: github.event_name == 'push' || inputs.build_android_apk
        uses: actions/upload-artifact@v4
        with:
          name: mujeeb24-${{ env.MUJEEB_PRODUCTION_RELEASE == 'true' && 'production' || 'qa-preview' }}-arm64-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload APKs for older ARM and x86_64 devices
        if: github.event_name == 'push' || inputs.build_android_apk
        uses: actions/upload-artifact@v4
        with:
          name: mujeeb24-${{ env.MUJEEB_PRODUCTION_RELEASE == 'true' && 'production' || 'qa-preview' }}-other-abis-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload signed production AAB for Google Play
        if: inputs.production_release && inputs.build_android_bundle
        uses: actions/upload-artifact@v4
        with:
          name: mujeeb24-production-aab-build-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload immutable release manifest and checksums
        if: (github.event_name == 'push' || inputs.build_android_apk || inputs.build_android_bundle) && success()
        uses: actions/upload-artifact@v4
        with:
          name: mujeeb24-build-${{ github.run_number }}-manifest
          path: android-artifacts-manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient signing secrets from build workspace
        if: always()
        shell: bash
        run: rm -f android/app/release.keystore android/key.properties

  # Production signing credentials are never made available to PR APK checks.
  build-android-pr-check:
    name: Verify isolated Android preview APKs (no secrets)
    needs: quality-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MUJEEB_PRODUCTION_RELEASE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build all three preview APK architectures
        run: flutter build apk --release --split-per-abi
      - name: Verify Android architecture APK outputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            printf '%s bytes: %s\n' "$(stat -c %s "$apk")" "$apk"
          done

  # =========================================================================
  # 3. iOS Build Job: Release Build without codesign (macOS Runner)
  # =========================================================================
  build-ios:
    name: Build iOS Release (Unsigned)
    needs: quality-gate
    # Runs on manual dispatch when requested, or on main push if enabled
    if: (github.event_name == 'workflow_dispatch' && inputs.build_ios)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Log macOS & Xcode Diagnostics
        run: |
          echo "=== macOS Diagnostic Information ==="
          sw_vers
          xcodebuild -version
          flutter --version

      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios && pod install --repo-update || true
          cd ..

      - name: Validate optional iOS API override
        id: api_args
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          SECRET_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          endpoint="${INPUT_API_BASE_URL:-${SECRET_API_BASE_URL:-}}"
          if [[ -n "$endpoint" ]]; then
            if [[ ! "$endpoint" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/api/v1)?/?$ ]]; then
              echo '::error::API base URL must be HTTPS with an optional /api/v1 path.'
              exit 1
            fi
            printf 'dart_define=--dart-define=API_BASE_URL=%s\n' "$endpoint" >> "$GITHUB_OUTPUT"
          else
            echo 'dart_define=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS Release (--no-codesign)
        run: |
          echo "Building iOS Release without codesigning (Build #${{ github.run_number }})..."
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} ${{ steps.api_args.outputs.dart_define }}

      - name: Package iOS Release App Bundle
        run: |
          cd build/ios/iphoneos
          zip -r mujeeb24-ios-unsigned.zip Runner.app
          cd ../../..

      - name: Upload iOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mujeeb24-ios-unsigned-build-${{ github.run_number }}
          path: build/ios/iphoneos/mujeeb24-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
